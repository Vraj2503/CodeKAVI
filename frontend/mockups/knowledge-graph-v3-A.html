<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeKavi Knowledge Graph - Inline Expansion</title>
<style>
  :root {
    --background: 30 9% 6%;
    --foreground: 40 18% 94%;
    --card: 30 8% 9%;
    --muted: 30 6% 14%;
    --muted-foreground: 36 8% 62%;
    --border: 32 7% 19%;
    --signal: 34 96% 56%;
    --destructive: 2 72% 58%;
    --success: 148 52% 52%;
    --viz-cat-1: 212 100% 67%;
    --viz-cat-2: 129 49% 49%;
    --viz-cat-3: 266 100% 77%;
    --viz-cat-4: 26 85% 59%;
    --viz-cat-5: 328 89% 72%;
    --viz-cat-6: 209 100% 74%;
    --viz-cat-7: 126 50% 45%;
    --viz-cat-8: 267 80% 70%;
    --viz-edge: 32 7% 19%;
    --radius: 0.5rem;
    
    --role-core_module: var(--viz-cat-1);
    --role-shared_utility: var(--viz-cat-2);
    --role-internal_helper: var(--viz-cat-3);
    --role-leaf: var(--viz-cat-4);
    --role-test: var(--viz-cat-5);
    --role-orchestrator: var(--viz-cat-6);
    --role-entry_point: var(--viz-cat-7);
    --role-router: var(--viz-cat-8);
    --role-config: 0 0% 50%;
  }
  
  body {
    background: hsl(var(--background));
    color: hsl(var(--foreground));
    font-family: system-ui, -apple-system, sans-serif;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  
  header {
    padding: 1rem 2rem;
    border-bottom: 1px solid hsl(var(--border));
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: hsl(var(--background));
    z-index: 100;
  }
  
  .status-bar {
    font-size: 0.875rem;
    color: hsl(var(--muted-foreground));
    cursor: help;
    position: relative;
  }
  
  .status-bar:hover::after {
    content: attr(data-tooltip);
    position: absolute;
    top: 100%;
    left: 0;
    background: hsl(var(--card));
    border: 1px solid hsl(var(--border));
    padding: 0.5rem;
    border-radius: var(--radius);
    width: 250px;
    z-index: 1000;
    color: hsl(var(--foreground));
    white-space: pre-wrap;
    margin-top: 0.5rem;
  }
  
  .controls button {
    background: hsl(var(--card));
    color: hsl(var(--foreground));
    border: 1px solid hsl(var(--border));
    padding: 0.5rem 1rem;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 0.875rem;
    transition: all 0.2s;
  }
  
  .controls button.active {
    background: hsl(var(--signal) / 0.1);
    border-color: hsl(var(--signal));
    color: hsl(var(--signal));
    box-shadow: 0 0 10px hsl(var(--signal) / 0.2);
  }
  
  .controls button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  
  .main-area {
    display: flex;
    flex: 1;
    overflow: hidden;
    position: relative;
  }
  
  .scroll-container {
    flex: 1;
    overflow-y: auto;
    padding: 2rem;
    position: relative;
  }
  
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 1.5rem;
    position: relative;
    z-index: 10;
    grid-auto-flow: dense;
  }
  
  .card {
    background: hsl(var(--card));
    border: 1px solid hsl(var(--border));
    border-radius: var(--radius);
    padding: 1rem;
    cursor: pointer;
    transition: all 400ms ease-out;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 1;
  }
  
  .card:hover {
    border-color: hsl(var(--muted-foreground));
    transform: translateY(-2px);
  }
  
  .card.expanded {
    grid-column: span 3;
    grid-row: span 2;
    min-height: 400px;
    border-color: hsl(var(--signal));
    cursor: default;
    z-index: 20;
    transform: none;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 0.5rem;
  }
  
  .card-title {
    font-weight: 600;
    word-break: break-all;
  }
  
  .card.expanded .card-title {
    cursor: pointer;
  }
  
  .card.expanded .card-title:hover {
    text-decoration: underline;
  }
  
  .role-badge {
    font-size: 0.7rem;
    padding: 0.1rem 0.4rem;
    border-radius: 1rem;
    text-transform: uppercase;
    font-weight: bold;
    color: hsl(var(--background));
  }
  
  .importance-bar {
    height: 4px;
    background: hsl(var(--muted));
    border-radius: 2px;
    margin-bottom: 0.75rem;
    overflow: hidden;
    width: 100%;
  }
  
  .importance-fill {
    height: 100%;
    background: hsl(var(--signal));
  }
  
  .card-meta {
    font-size: 0.75rem;
    color: hsl(var(--muted-foreground));
    margin-bottom: 0.5rem;
  }
  
  .top-symbols {
    display: flex;
    flex-wrap: wrap;
    gap: 0.25rem;
    margin-bottom: 0.5rem;
  }
  
  .pill {
    background: hsl(var(--muted));
    font-size: 0.7rem;
    padding: 0.1rem 0.4rem;
    border-radius: 0.25rem;
  }
  
  .effects {
    display: flex;
    gap: 0.25rem;
    margin-top: auto;
  }
  
  .effect-icon {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    display: inline-block;
    opacity: 0.8;
  }
  
  .effect-filesystem { background: #3b82f6; }
  .effect-network { background: #f97316; }
  .effect-cache { background: #a855f7; }
  .effect-llm { background: #22c55e; }
  .effect-db { background: #ef4444; }
  .effect-subprocess { background: #eab308; }
  .effect-concurrency { background: #14b8a6; }
  
  /* Expanded State */
  .internal-canvas {
    display: none;
    flex: 1;
    background: hsl(var(--background));
    border-radius: var(--radius);
    margin-top: 1rem;
    position: relative;
    border: 1px solid hsl(var(--border));
    overflow: hidden;
  }
  
  .card.expanded .internal-canvas {
    display: block;
  }
  
  .symbol-node {
    position: absolute;
    background: hsl(var(--muted));
    border: 1px solid hsl(var(--border));
    padding: 0.25rem 0.5rem;
    border-radius: 1rem;
    font-size: 0.75rem;
    cursor: pointer;
    transform: translate(-50%, -50%);
    white-space: nowrap;
    z-index: 2;
    transition: border-color 0.2s;
  }
  
  .symbol-node:hover, .symbol-node.selected {
    border-color: hsl(var(--signal));
    background: hsl(var(--card));
  }
  
  .symbol-badge {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 4px;
  }
  .type-function { background: #a855f7; }
  .type-class { background: #3b82f6; }
  .type-method { background: #14b8a6; }
  
  .internal-edges {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
  }
  
  /* More Files Section */
  .more-section {
    margin-top: 3rem;
    padding-top: 2rem;
    border-top: 1px dashed hsl(var(--border));
  }
  
  .more-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
  }
  
  .search-bar {
    background: hsl(var(--card));
    border: 1px solid hsl(var(--border));
    color: hsl(var(--foreground));
    padding: 0.5rem;
    border-radius: var(--radius);
    width: 250px;
  }
  
  .mini-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 0.75rem;
  }
  
  .mini-card {
    background: hsl(var(--background));
    border: 1px solid hsl(var(--border));
    border-radius: var(--radius);
    padding: 0.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    opacity: 0.7;
  }
  
  .mini-card:hover {
    opacity: 1;
    border-color: hsl(var(--muted-foreground));
  }
  
  .mini-card .card-title {
    font-size: 0.75rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  
  .add-btn {
    background: none;
    border: none;
    color: hsl(var(--signal));
    cursor: pointer;
    font-size: 1.2rem;
    line-height: 1;
    padding: 0 0.25rem;
  }
  
  /* Inspector Panel */
  .inspector {
    width: 360px;
    background: hsl(var(--card));
    border-left: 1px solid hsl(var(--border));
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform 300ms ease;
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    z-index: 50;
  }
  
  .inspector.open {
    transform: translateX(0);
    position: static;
  }
  
  .inspector-header {
    padding: 1rem;
    border-bottom: 1px solid hsl(var(--border));
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  
  .inspector-close {
    background: none;
    border: none;
    color: hsl(var(--muted-foreground));
    cursor: pointer;
    font-size: 1.5rem;
  }
  
  .inspector-content {
    padding: 1rem;
    overflow-y: auto;
    flex: 1;
  }
  
  .inspector h2 {
    margin: 0 0 0.5rem 0;
    font-size: 1.25rem;
    word-break: break-all;
  }
  
  .meta-row {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1rem;
    flex-wrap: wrap;
  }
  
  .badge {
    font-size: 0.7rem;
    padding: 0.2rem 0.5rem;
    border-radius: 1rem;
    background: hsl(var(--muted));
  }
  
  .badge.http { background: hsl(var(--viz-cat-4) / 0.2); color: hsl(var(--viz-cat-4)); }
  .badge.async { background: hsl(var(--viz-cat-1) / 0.2); color: hsl(var(--viz-cat-1)); }
  
  .code-block {
    background: hsl(var(--background));
    border: 1px solid hsl(var(--border));
    border-radius: var(--radius);
    padding: 0.75rem;
    font-family: monospace;
    font-size: 0.8rem;
    margin-bottom: 1rem;
    overflow-x: auto;
    white-space: pre-wrap;
  }
  
  .docstring {
    font-size: 0.9rem;
    color: hsl(var(--muted-foreground));
    margin-bottom: 1rem;
    font-style: italic;
  }
  
  .section-title {
    font-size: 0.8rem;
    text-transform: uppercase;
    color: hsl(var(--muted-foreground));
    margin: 1rem 0 0.5rem 0;
    font-weight: 600;
  }
  
  ul.call-list {
    list-style: none;
    padding: 0;
    margin: 0;
    font-family: monospace;
    font-size: 0.8rem;
  }
  
  ul.call-list li {
    padding: 0.25rem 0;
    border-bottom: 1px solid hsl(var(--border));
  }
  
  /* Concept Overlay */
  .concept-hull {
    position: absolute;
    pointer-events: none;
    z-index: 5;
    border-radius: 20px;
    opacity: 0.15;
    transition: opacity 0.3s;
  }
  .concept-label {
    position: absolute;
    background: rgba(0,0,0,0.7);
    color: #fff;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 0.8rem;
    pointer-events: auto;
    cursor: pointer;
    z-index: 6;
    border: 1px solid;
    transform: translate(-50%, -50%);
  }
  
  /* SVG Edges */
  #global-edges {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }
  
  .edge-path {
    fill: none;
    stroke: hsl(var(--viz-edge));
    transition: stroke 0.2s, stroke-width 0.2s;
  }
  
  .edge-path.highlighted {
    stroke: hsl(var(--signal));
    z-index: 10;
  }
</style>
</head>

  </div>
</div>

<script>
// Will be replaced by inline data if needed, but for now we expect DATA to be defined.
// In our generated python script, we inject the data properly.

setTimeout(() => {
  if (typeof DATA === 'undefined') {
    console.error("DATA not loaded!");
    return;
  }
  
  const state = {
    drawnGroups: DATA.groups.filter(g => g.drawn).sort((a,b) => b.importance - a.importance),
    hiddenGroups: DATA.groups.filter(g => !g.drawn),
    expandedGroupId: null,
    conceptsActive: true, // Start active per requirement
    selectedSymbolId: null
  };
  
  const colors = [
    'var(--viz-cat-1)', 'var(--viz-cat-2)', 'var(--viz-cat-3)', 
    'var(--viz-cat-4)', 'var(--viz-cat-5)', 'var(--viz-cat-6)'
  ];
  
  function getRoleColor(role) {
    return `var(--role-${role}, var(--muted))`;
  }
  
  function renderApp() {
    renderStatusBar();
    renderMainGrid();
    renderMoreSection();
    updateConceptsBtn();
    
    // Defer edge rendering to allow layout to settle
    setTimeout(() => {
      renderGlobalEdges();
      renderConcepts();
    }, 100);
  }
  
  function renderStatusBar() {
    const el = document.getElementById('status-bar');
    const { metadata, diagnostics } = DATA;
    el.textContent = `Showing ${state.drawnGroups.length} of ${metadata.total_groups} files · ${diagnostics.node_count} of ${metadata.total_symbols} symbols · ${(diagnostics.resolution_rate*100).toFixed(1)}% calls resolved · ${metadata.unsupported_languages.join(', ')} not parsed`;
    
    el.setAttribute('data-tooltip', JSON.stringify(diagnostics, null, 2));
  }
  
  function createEffectIcons(effects) {
    if (!effects) return '';
    return effects.map(e => `<span class="effect-icon effect-${e}" title="${e}"></span>`).join('');
  }
  
  function renderMainGrid() {
    const grid = document.getElementById('main-grid');
    grid.innerHTML = '';
    
    state.drawnGroups.forEach(g => {
      const card = document.createElement('div');
      card.className = 'card';
      if (state.expandedGroupId === g.id) card.classList.add('expanded');
      card.id = `group-${g.id.replace(/[^a-zA-Z0-9-]/g, '-')}`;
      
      const roleColor = getRoleColor(g.role);
      
      card.innerHTML = `
        <div class="card-header" ${state.expandedGroupId === g.id ? 'onclick="collapseCard(event)"' : ''}>
          <div class="card-title">${g.label}</div>
          <div class="role-badge" style="background-color: hsl(${roleColor})">${g.role.replace('_',' ')}</div>
        </div>
        <div class="importance-bar"><div class="importance-fill" style="width: ${g.importance}%"></div></div>
        <div class="card-meta">${g.symbol_count} symbols</div>
        <div class="top-symbols">
          ${(g.top_symbols||[]).slice(0,3).map(s => `<span class="pill">${s}</span>`).join('')}
        </div>
        <div class="effects">
          ${createEffectIcons(g.effects)}
        </div>
        <div class="internal-canvas" id="canvas-${g.id.replace(/[^a-zA-Z0-9-]/g, '-')}">
          <svg class="internal-edges"></svg>
        </div>
      `;
      
      if (state.expandedGroupId !== g.id) {
        card.onclick = () => expandCard(g.id);
        card.onmouseenter = () => highlightEdges(g.id);
        card.onmouseleave = () => resetEdges();
      }
      
      grid.appendChild(card);
      
      if (state.expandedGroupId === g.id) {
        renderInternalCanvas(g);
      }
    });
  }
  
  window.expandCard = (id) => {
    state.expandedGroupId = id;
    renderApp();
  }
  
  window.collapseCard = (e) => {
    e.stopPropagation();
    state.expandedGroupId = null;
    renderApp();
  }
  
  function renderInternalCanvas(group) {
    // Delay to let CSS transition finish layout before calculating positions
    setTimeout(() => {
      const canvasId = `canvas-${group.id.replace(/[^a-zA-Z0-9-]/g, '-')}`;
      const canvas = document.getElementById(canvasId);
      if (!canvas) return;
      
      const rect = canvas.getBoundingClientRect();
      const width = rect.width;
      const height = rect.height;
      
      const symbols = DATA.nodes.filter(n => n.file === group.file);
      const svg = canvas.querySelector('svg');
      
      // Simple force-directed-like circular layout
      const cx = width / 2;
      const cy = height / 2;
      const radius = Math.min(width, height) * 0.35;
      
      const nodePos = {};
      
      symbols.forEach((sym, i) => {
        const angle = (i / symbols.length) * 2 * Math.PI;
        const x = cx + radius * Math.cos(angle);
        const y = cy + radius * Math.sin(angle);
        nodePos[sym.id] = {x, y};
        
        const node = document.createElement('div');
        node.className = 'symbol-node';
        if (state.selectedSymbolId === sym.id) node.classList.add('selected');
        node.style.left = `${x}px`;
        node.style.top = `${y}px`;
        node.innerHTML = `<span class="symbol-badge type-${sym.type}"></span>${sym.label}`;
        
        // Add subtle annotation for degree vs visible connections
        const visibleConnections = DATA.edges.filter(e => e.source === sym.id || e.target === sym.id).length;
        const totalConnections = sym.in_degree + sym.out_degree;
        if (totalConnections > visibleConnections) {
             node.title = `${totalConnections} total connections (${visibleConnections} shown)`;
        }
        
        node.onclick = (e) => {
          e.stopPropagation();
          inspectSymbol(sym);
          // Update selected style
          canvas.querySelectorAll('.symbol-node').forEach(n => n.classList.remove('selected'));
          node.classList.add('selected');
        };
        canvas.appendChild(node);
      });
      
      // Draw internal edges
      let edgesHtml = '';
      DATA.edges.forEach(e => {
        if (nodePos[e.source] && nodePos[e.target]) {
          const s = nodePos[e.source];
          const t = nodePos[e.target];
          edgesHtml += `<line x1="${s.x}" y1="${s.y}" x2="${t.x}" y2="${t.y}" stroke="hsl(var(--border))" stroke-width="1" />`;
        }
      });
      svg.innerHTML = edgesHtml;
    }, 450);
  }
  
  function renderMoreSection() {
    const grid = document.getElementById('mini-grid');
    grid.innerHTML = '';
    
    document.getElementById('more-title').textContent = `${state.hiddenGroups.length} additional files not shown in overview`;
    
    const term = (document.getElementById('search-input').value || '').toLowerCase();
    
    state.hiddenGroups.filter(g => g.label.toLowerCase().includes(term)).forEach(g => {
      const card = document.createElement('div');
      card.className = 'mini-card';
      const roleColor = getRoleColor(g.role);
      
      card.innerHTML = `
        <div class="card-title" title="${g.file}">${g.label}</div>
        <div style="display:flex; align-items:center; gap:0.5rem;">
          <div class="role-badge" style="background-color: hsl(${roleColor})">${g.role.replace('_',' ')}</div>
          <button class="add-btn" title="Add to overview">+</button>
        </div>
      `;
      
      card.querySelector('.add-btn').onclick = () => {
        g.drawn = true;
        state.drawnGroups.push(g);
        state.drawnGroups.sort((a,b) => b.importance - a.importance);
        state.hiddenGroups = state.hiddenGroups.filter(x => x.id !== g.id);
        renderApp();
      };
      
      grid.appendChild(card);
    });
  }
  
  document.getElementById('search-input').addEventListener('input', renderMoreSection);
  
  function renderGlobalEdges() {
    const svg = document.getElementById('global-edges');
    svg.innerHTML = '';
    const container = document.getElementById('scroll-container');
    const rects = {};
    
    state.drawnGroups.forEach(g => {
      const el = document.getElementById(`group-${g.id.replace(/[^a-zA-Z0-9-]/g, '-')}`);
      if (el) {
        const r = el.getBoundingClientRect();
        const cr = container.getBoundingClientRect();
        rects[g.id] = {
          x: r.left - cr.left + r.width/2 + container.scrollLeft,
          y: r.top - cr.top + r.height/2 + container.scrollTop
        };
      }
    });
    
    let html = '';
    // Arrow marker
    html += `
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="hsl(var(--viz-edge))" />
        </marker>
        <marker id="arrow-highlight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="hsl(var(--signal))" />
        </marker>
      </defs>
    `;
    
    DATA.group_edges.forEach(e => {
      if (rects[e.source] && rects[e.target]) {
        const s = rects[e.source];
        const t = rects[e.target];
        const dx = t.x - s.x;
        const dy = t.y - s.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        const curve = dist * 0.2;
        
        // A simple curved path
        const d = `M ${s.x} ${s.y} Q ${s.x + curve} ${s.y - curve} ${t.x} ${t.y}`;
        const width = Math.max(1, Math.min(5, e.weight / 2));
        
        html += `<path d="${d}" class="edge-path" data-source="${e.source}" data-target="${e.target}" stroke-width="${width}" marker-end="url(#arrow)" />`;
      }
    });
    
    svg.innerHTML = html;
  }
  
  function highlightEdges(groupId) {
    document.querySelectorAll('.edge-path').forEach(p => {
      if (p.dataset.source === groupId || p.dataset.target === groupId) {
        p.classList.add('highlighted');
        p.setAttribute('marker-end', 'url(#arrow-highlight)');
      } else {
        p.style.opacity = '0.1';
      }
    });
  }
  
  function resetEdges() {
    document.querySelectorAll('.edge-path').forEach(p => {
      p.classList.remove('highlighted');
      p.style.opacity = '1';
      p.setAttribute('marker-end', 'url(#arrow)');
    });
  }
  
  // Concept Overlay
  document.getElementById('concept-btn').onclick = () => {
    if (DATA.concepts.metadata.fallback_reason) return;
    state.conceptsActive = !state.conceptsActive;
    renderApp();
  };
  
  function updateConceptsBtn() {
    const btn = document.getElementById('concept-btn');
    if (DATA.concepts.metadata.fallback_reason) {
      btn.textContent = '✦ Concepts unavailable';
      btn.disabled = true;
      btn.title = DATA.concepts.metadata.fallback_reason;
      btn.className = '';
    } else if (state.conceptsActive) {
      btn.textContent = '✦ Concepts (On)';
      btn.className = 'active';
      btn.title = 'Click to disable concept overlay';
    } else {
      btn.textContent = '✦ Enrich with AI';
      btn.className = '';
      btn.title = 'Uses LLM to identify high-level concepts. Billed.';
    }
  }
  
  function renderConcepts() {
    const layer = document.getElementById('concept-layer');
    layer.innerHTML = '';
    if (!state.conceptsActive || DATA.concepts.metadata.fallback_reason) return;
    
    const container = document.getElementById('scroll-container');
    const cr = container.getBoundingClientRect();
    
    DATA.concepts.entities.forEach((entity, idx) => {
      // Find drawn groups that are in this concept
      const memberGroups = entity.files.filter(f => state.drawnGroups.find(g => g.file === f));
      if (memberGroups.length === 0) return;
      
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      
      memberGroups.forEach(f => {
        const group = state.drawnGroups.find(g => g.file === f);
        const el = document.getElementById(`group-${group.id.replace(/[^a-zA-Z0-9-]/g, '-')}`);
        if (el) {
          const r = el.getBoundingClientRect();
          const x = r.left - cr.left + container.scrollLeft;
          const y = r.top - cr.top + container.scrollTop;
          minX = Math.min(minX, x);
          minY = Math.min(minY, y);
          maxX = Math.max(maxX, x + r.width);
          maxY = Math.max(maxY, y + r.height);
        }
      });
      
      if (minX === Infinity) return;
      
      const padding = 20;
      minX -= padding; minY -= padding;
      maxX += padding; maxY += padding;
      
      const color = colors[idx % colors.length];
      
      const hull = document.createElement('div');
      hull.className = 'concept-hull';
      hull.style.left = `${minX}px`;
      hull.style.top = `${minY}px`;
      hull.style.width = `${maxX - minX}px`;
      hull.style.height = `${maxY - minY}px`;
      hull.style.backgroundColor = `hsl(${color})`;
      
      const label = document.createElement('div');
      label.className = 'concept-label';
      label.style.left = `${minX + (maxX - minX)/2}px`;
      label.style.top = `${minY}px`;
      label.style.borderColor = `hsl(${color})`;
      label.textContent = entity.name;
      label.title = entity.summary;
      
      layer.appendChild(hull);
      layer.appendChild(label);
    });
  }
  
  // Inspector
  function inspectSymbol(sym) {
    state.selectedSymbolId = sym.id;
    const panel = document.getElementById('inspector');
    const content = document.getElementById('inspector-content');
    
    let httpBadge = sym.http ? `<span class="badge http">${sym.http}</span>` : '';
    let asyncBadge = sym.is_async ? `<span class="badge async">async</span>` : '';
    let roleBadge = `<span class="badge" style="background-color: hsl(${getRoleColor(sym.role)})\">${sym.role.replace('_',' ')}</span>`;
    
    content.innerHTML = `
      <h2 style="margin-top:0">${sym.label} <span class="badge" style="font-weight:normal">${sym.type}</span></h2>
      <div class="docstring">${sym.file}:${sym.line}</div>
      <div class="meta-row">${roleBadge} ${httpBadge} ${asyncBadge}</div>
      
      <div class="importance-bar"><div class="importance-fill" style="width: ${sym.importance}%"></div></div>
      <div style="font-size:0.75rem; color:hsl(var(--muted-foreground)); margin-bottom:1rem;">Importance Score: ${sym.importance.toFixed(1)}</div>
      
      <div class="section-title">Signature</div>
      <div class="code-block">${sym.label}${sym.signature || '()'}</div>
      
      ${sym.doc ? `<div class="section-title">Docstring</div><div class="docstring">${sym.doc}</div>` : ''}
      
      ${sym.effects && sym.effects.length ? `
        <div class="section-title">Effects</div>
        <div class="meta-row">
          ${sym.effects.map(e => `<span class="badge" style="display:flex; align-items:center; gap:4px"><span class="effect-icon effect-${e}"></span>${e}</span>`).join('')}
        </div>
      ` : ''}
      
      ${sym.external_calls && sym.external_calls.length ? `
        <div class="section-title">External Calls</div>
        <ul class="call-list">
          ${sym.external_calls.map(c => `<li>${c}</li>`).join('')}
        </ul>
      ` : ''}
      
      <div class="section-title">Callers (${sym.in_degree})</div>
      <div class="section-title">Callees (${sym.out_degree})</div>
    `;
    
    panel.classList.add('open');
  }
  
  document.getElementById('inspector-close').onclick = () => {
    document.getElementById('inspector').classList.remove('open');
    state.selectedSymbolId = null;
    const canvas = document.querySelector('.card.expanded .internal-canvas');
    if (canvas) {
        canvas.querySelectorAll('.symbol-node').forEach(n => n.classList.remove('selected'));
    }
  };
  
  // Setup resize observer to redraw edges
  window.addEventListener('resize', () => {
    renderGlobalEdges();
    renderConcepts();
  });
  
  renderApp();
}, 100);
</script>
</body>
</html>
