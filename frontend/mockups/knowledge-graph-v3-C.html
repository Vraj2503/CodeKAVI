<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zoom Canvas - Knowledge Graph</title>
<style>
:root {
  --background: 30 9% 6%;
  --foreground: 40 18% 94%;
  --card: 30 8% 9%;
  --muted: 30 6% 14%;
  --muted-foreground: 36 8% 62%;
  --border: 32 7% 19%;
  --signal: 34 96% 56%;
  --destructive: 2 72% 58%;
  --success: 148 52% 52%;
  --viz-cat-1: 212 100% 67%;
  --viz-cat-2: 129 49% 49%;
  --viz-cat-3: 266 100% 77%;
  --viz-cat-4: 26 85% 59%;
  --viz-cat-5: 328 89% 72%;
  --viz-cat-6: 209 100% 74%;
  --viz-cat-7: 126 50% 45%;
  --viz-cat-8: 267 80% 70%;
  --viz-edge: 32 7% 19%;
  --radius: 0.5rem;
}

* { box-sizing: border-box; }
body {
  margin: 0; padding: 0;
  background-color: hsl(var(--background));
  color: hsl(var(--foreground));
  font-family: system-ui, -apple-system, sans-serif;
  overflow: hidden;
  width: 100vw; height: 100vh;
}

#canvas-container {
  width: 100%; height: 100%;
  cursor: grab;
}
#canvas-container:active { cursor: grabbing; }
svg { width: 100%; height: 100%; }

/* UI Overlays */
#toolbar {
  position: absolute; top: 1rem; left: 1rem; right: 1rem;
  display: flex; justify-content: space-between; align-items: flex-start;
  pointer-events: none;
}
.btn {
  pointer-events: auto;
  background: hsl(var(--card)); border: 1px solid hsl(var(--border));
  color: hsl(var(--foreground));
  padding: 0.5rem 1rem; border-radius: var(--radius);
  cursor: pointer; font-size: 0.875rem;
  display: flex; align-items: center; gap: 0.5rem;
}
.btn:hover { background: hsl(var(--muted)); }

#breadcrumb {
  display: none;
  pointer-events: auto;
  background: hsl(var(--card)); border: 1px solid hsl(var(--border));
  padding: 0.5rem 1rem; border-radius: var(--radius);
  font-size: 0.875rem; color: hsl(var(--foreground));
}
#breadcrumb span { cursor: pointer; color: hsl(var(--muted-foreground)); }
#breadcrumb span:hover { color: hsl(var(--foreground)); }

#status-bar {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: hsl(var(--card)); border-top: 1px solid hsl(var(--border));
  padding: 0.5rem 1rem; font-size: 0.75rem; color: hsl(var(--muted-foreground));
  display: flex; justify-content: space-between;
}
.pulse {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  background: hsl(var(--signal));
  animation: pulse 2s infinite;
}
@keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

#inspector {
  position: absolute; top: 5rem; right: 1rem; width: 300px;
  background: hsl(var(--card)); border: 1px solid hsl(var(--border));
  border-radius: var(--radius); padding: 1rem;
  display: none; pointer-events: auto;
}
#inspector h3 { margin: 0 0 0.5rem 0; font-size: 1rem; }
#inspector .mono { font-family: monospace; font-size: 0.75rem; color: hsl(var(--muted-foreground)); background: hsl(var(--background)); padding: 0.25rem; border-radius: 4px; display: block; margin-bottom: 0.5rem;}
#inspector .doc { font-size: 0.875rem; margin-bottom: 0.5rem; }
#inspector .pill { display: inline-block; padding: 0.25rem 0.5rem; border-radius: 12px; background: hsl(var(--muted)); font-size: 0.75rem; margin-right: 0.25rem; }

#search-palette {
  position: absolute; top: 20%; left: 50%; transform: translateX(-50%);
  width: 400px; background: hsl(var(--card)); border: 1px solid hsl(var(--border));
  border-radius: var(--radius); padding: 0.5rem; display: none; pointer-events: auto;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
#search-input {
  width: 100%; background: transparent; border: none; color: hsl(var(--foreground));
  font-size: 1rem; padding: 0.5rem; outline: none;
}
#search-results { max-height: 200px; overflow-y: auto; margin-top: 0.5rem; }
.search-item { padding: 0.5rem; cursor: pointer; border-radius: 4px; display: flex; justify-content: space-between; }
.search-item:hover { background: hsl(var(--muted)); }

#minimap {
  position: absolute; bottom: 3rem; right: 1rem; width: 150px; height: 100px;
  background: hsl(var(--card)); border: 1px solid hsl(var(--border)); border-radius: var(--radius);
  pointer-events: none; opacity: 0.8;
}

/* SVG Elements */
.group-rect { fill: hsl(var(--card)); stroke: hsl(var(--border)); stroke-width: 1; rx: 8; transition: opacity 0.8s; }
.group-label { fill: hsl(var(--foreground)); font-size: 12px; user-select: none; pointer-events: none; }
.group-edge { fill: none; stroke: hsl(var(--viz-edge)); transition: opacity 0.8s; }
.symbol-dot { fill: hsl(var(--muted-foreground)); transition: opacity 0.8s; }
.symbol-node { cursor: pointer; }
.symbol-rect { fill: hsl(var(--background)); stroke: hsl(var(--border)); stroke-width: 1; rx: 4; }
.symbol-label { fill: hsl(var(--foreground)); font-size: 10px; user-select: none; pointer-events: none; }
.symbol-edge { fill: none; stroke: hsl(var(--viz-edge)); stroke-width: 1; opacity: 0; transition: opacity 0.8s; }

.concept-zone { fill-opacity: 0.1; stroke-dasharray: 4; stroke-width: 2; transition: opacity 0.8s; }
.concept-label { fill: hsl(var(--foreground)); font-size: 14px; font-weight: bold; pointer-events: none; }
.concept-edge { fill: none; stroke: hsl(var(--foreground)); stroke-opacity: 0.3; stroke-width: 2; stroke-dasharray: 4; }

.role-core_module { stroke: hsl(var(--viz-cat-1)); }
.role-shared_utility { stroke: hsl(var(--viz-cat-2)); }
.role-internal_helper { stroke: hsl(var(--viz-cat-3)); }
.role-leaf { stroke: hsl(var(--viz-cat-4)); }
.role-test { stroke: hsl(var(--viz-cat-5)); }
.role-orchestrator { stroke: hsl(var(--viz-cat-6)); }
.role-entry_point { stroke: hsl(var(--viz-cat-7)); }
.role-router { stroke: hsl(var(--viz-cat-8)); }
.role-config { stroke: hsl(var(--muted-foreground)); }

.fill-core_module { fill: hsl(var(--viz-cat-1)); }
.fill-shared_utility { fill: hsl(var(--viz-cat-2)); }
.fill-internal_helper { fill: hsl(var(--viz-cat-3)); }
.fill-leaf { fill: hsl(var(--viz-cat-4)); }
.fill-test { fill: hsl(var(--viz-cat-5)); }
.fill-orchestrator { fill: hsl(var(--viz-cat-6)); }
.fill-entry_point { fill: hsl(var(--viz-cat-7)); }
.fill-router { fill: hsl(var(--viz-cat-8)); }
.fill-config { fill: hsl(var(--muted-foreground)); }
</style>
</head>
<body>

<div id="canvas-container">
  <svg id="canvas">
    <defs>
      <marker id="arrow" viewBox="0 -5 10 10" refX="8" refY="0" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M0,-5L10,0L0,5" fill="hsl(var(--viz-edge))"></path>
      </marker>
    </defs>
    <g id="viewport">
      <g id="layer-concepts"></g>
      <g id="layer-edges"></g>
      <g id="layer-groups"></g>
    </g>
  </svg>
</div>

<div id="toolbar">
  <div id="breadcrumb">
    <span onclick="zoomOut()">Overview</span> <span id="breadcrumb-current"></span>
  </div>
  <div>
    <button class="btn" id="btn-concepts" onclick="toggleConcepts()">
      <span class="pulse" id="concept-pulse" style="display:none"></span>
      <span id="concept-text">✦ Concepts</span>
    </button>
  </div>
</div>

<div id="search-palette">
  <input type="text" id="search-input" placeholder="Search files... (Cmd+K)" autocomplete="off">
  <div id="search-results"></div>
</div>

<div id="inspector"></div>

<div id="minimap">
  <svg viewBox="0 0 2000 2000" preserveAspectRatio="xMidYMid meet">
    <g id="minimap-content"></g>
    <rect id="minimap-viewport" fill="none" stroke="hsl(var(--signal))" stroke-width="20"></rect>
  </svg>
</div>

<div id="status-bar">
  <div id="status-text"></div>
</div>

const svg = document.getElementById('canvas');
const viewport = document.getElementById('viewport');
const layerConcepts = document.getElementById('layer-concepts');
const layerEdges = document.getElementById('layer-edges');
const layerGroups = document.getElementById('layer-groups');
const statusBar = document.getElementById('status-text');
const inspector = document.getElementById('inspector');
const searchPalette = document.getElementById('search-palette');
const searchInput = document.getElementById('search-input');
const searchResults = document.getElementById('search-results');

let mode = 'overview'; // 'overview' | 'drilldown'
let transform = { x: 0, y: 0, k: 1 };
let isDragging = false;
let startMouse = { x: 0, y: 0 };
let activeGroup = null;
let conceptState = 2; // 1: not req, 2: active, 3: failed

const W = window.innerWidth, H = window.innerHeight;

// Force sim state
let groupPositions = {};
let nodePositions = {};

function init() {
  // Update status bar
  const t = DATA.metadata.is_truncated ? `<span class="pulse"></span> ` : '';
  statusBar.innerHTML = `${t}Showing ${DATA.metadata.drawn_groups} of ${DATA.metadata.total_groups} files · ${DATA.diagnostics.node_count} of ${DATA.metadata.total_symbols} symbols · ${(DATA.diagnostics.resolution_rate*100).toFixed(1)}% calls resolved · ${DATA.metadata.unsupported_languages.join(', ')} not parsed`;

  // Layout groups
  layoutGroups();
  
  // Draw overview
  drawOverview();
  
  // Set initial view to fit groups
  fitView();

  // Draw minimap
  drawMinimap();

  if (conceptState === 2) drawConcepts();
}

function layoutGroups() {
  const cx = W/2, cy = H/2;
  DATA.groups.forEach(g => {
    groupPositions[g.id] = { x: cx + (Math.random()-0.5)*W*0.5, y: cy + (Math.random()-0.5)*H*0.5, vx: 0, vy: 0 };
  });

  const iters = 100;
  for(let i=0; i<iters; i++) {
    for(let a=0; a<DATA.groups.length; a++) {
      for(let b=a+1; b<DATA.groups.length; b++) {
        let g1 = DATA.groups[a], g2 = DATA.groups[b];
        let p1 = groupPositions[g1.id], p2 = groupPositions[g2.id];
        let dx = p1.x - p2.x, dy = p1.y - p2.y;
        let dist = Math.sqrt(dx*dx + dy*dy) || 0.1;
        let f = 50000 / (dist*dist);
        let fx = (dx/dist)*f, fy = (dy/dist)*f;
        p1.vx += fx; p1.vy += fy;
        p2.vx -= fx; p2.vy -= fy;
      }
    }
    DATA.group_edges.forEach(e => {
      let p1 = groupPositions[e.source], p2 = groupPositions[e.target];
      if(!p1 || !p2) return;
      let dx = p2.x - p1.x, dy = p2.y - p1.y;
      let dist = Math.sqrt(dx*dx + dy*dy) || 0.1;
      let f = (dist - 300) * 0.05 * (e.weight * 0.5);
      let fx = (dx/dist)*f, fy = (dy/dist)*f;
      p1.vx += fx; p1.vy += fy;
      p2.vx -= fx; p2.vy -= fy;
    });
    DATA.groups.forEach(g => {
      let p = groupPositions[g.id];
      p.vx += (cx - p.x) * 0.01;
      p.vy += (cy - p.y) * 0.01;
      p.x += p.vx; p.y += p.vy;
      p.vx *= 0.5; p.vy *= 0.5;
    });
  }
}

function drawOverview() {
  layerGroups.innerHTML = '';
  layerEdges.innerHTML = '';

  // Draw edges
  DATA.group_edges.forEach(e => {
    let p1 = groupPositions[e.source];
    let p2 = groupPositions[e.target];
    if(!p1 || !p2) return;
    
    let path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    let cx = (p1.x + p2.x)/2, cy = (p1.y + p2.y)/2 - 50; // curve
    path.setAttribute('d', `M${p1.x},${p1.y} Q${cx},${cy} ${p2.x},${p2.y}`);
    path.setAttribute('class', 'group-edge');
    path.setAttribute('stroke-width', Math.max(1, Math.log(e.weight)*2));
    path.setAttribute('id', `edge-${e.source.replace(/\W/g,'')}-${e.target.replace(/\W/g,'')}`);
    path.setAttribute('marker-end', 'url(#arrow)');
    layerEdges.appendChild(path);
  });

  // Draw groups
  DATA.groups.forEach(g => {
    let p = groupPositions[g.id];
    let width = Math.max(120, Math.min(200, g.symbol_count * 15));
    let height = width * 0.6;
    
    let gEl = document.createElementNS("http://www.w3.org/2000/svg", "g");
    gEl.setAttribute('id', `group-${g.id}`);
    gEl.setAttribute('transform', `translate(${p.x - width/2}, ${p.y - height/2})`);
    gEl.style.cursor = 'pointer';
    gEl.ondblclick = (e) => { e.stopPropagation(); zoomToGroup(g); };

    let rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    rect.setAttribute('width', width);
    rect.setAttribute('height', height);
    rect.setAttribute('class', `group-rect role-${g.role}`);
    if (!g.drawn) {
      rect.setAttribute('width', 40);
      rect.setAttribute('height', 20);
      gEl.setAttribute('transform', `translate(${p.x - 20}, ${p.y - 10})`);
    } else {
      rect.style.fill = `hsl(var(--card) / ${g.importance/100})`;
    }
    gEl.appendChild(rect);

    if (g.drawn) {
      let label = document.createElementNS("http://www.w3.org/2000/svg", "text");
      label.setAttribute('x', 10);
      label.setAttribute('y', 20);
      label.setAttribute('class', 'group-label');
      label.textContent = g.label;
      gEl.appendChild(label);

      // Dots
      for(let i=0; i<g.symbol_count; i++) {
        let dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        dot.setAttribute('cx', 10 + (i%5)*15);
        dot.setAttribute('y', 40 + Math.floor(i/5)*15);
        dot.setAttribute('r', 2);
        dot.setAttribute('class', 'symbol-dot');
        gEl.appendChild(dot);
      }
    } else {
      let label = document.createElementNS("http://www.w3.org/2000/svg", "text");
      label.setAttribute('x', 2);
      label.setAttribute('y', 14);
      label.setAttribute('class', 'group-label');
      label.style.fontSize = '8px';
      label.textContent = g.label.substring(0, 5) + '..';
      gEl.appendChild(label);
    }
    
    layerGroups.appendChild(gEl);
  });
}

function zoomToGroup(g) {
  mode = 'drilldown';
  activeGroup = g.id;
  document.getElementById('breadcrumb').style.display = 'flex';
  document.getElementById('breadcrumb-current').textContent = ' / ' + g.label;
  
  // Fade out others
  document.querySelectorAll('.group-rect, .group-label, .symbol-dot').forEach(el => el.style.opacity = '0.15');
  document.querySelectorAll('.group-edge').forEach(el => el.style.opacity = '0.05');
  
  let gEl = document.getElementById(`group-${g.id}`);
  gEl.querySelector('.group-rect').style.opacity = '1';
  gEl.querySelector('.group-rect').style.fill = 'transparent';

  // Find symbols for this group
  let symbols = DATA.nodes.filter(n => n.file === g.file);
  
  // Local force layout inside rect
  let width = 600, height = 400; 
  // Animate rect size
  let rect = gEl.querySelector('.group-rect');
  rect.style.transition = 'all 0.8s ease';
  rect.setAttribute('width', width);
  rect.setAttribute('height', height);
  gEl.setAttribute('transform', `translate(${groupPositions[g.id].x - width/2}, ${groupPositions[g.id].y - height/2})`);
  
  // Remove dots
  gEl.querySelectorAll('.symbol-dot').forEach(el => el.remove());
  
  // Add symbol nodes
  let sLayer = document.createElementNS("http://www.w3.org/2000/svg", "g");
  sLayer.setAttribute('id', 'symbol-layer');
  gEl.appendChild(sLayer);

  symbols.forEach((s, i) => {
    nodePositions[s.id] = { x: Math.random()*width, y: Math.random()*height };
  });

  // Local layout simple
  symbols.forEach((s, i) => {
    let nx = 50 + (i%4)*130;
    let ny = 80 + Math.floor(i/4)*80;
    nodePositions[s.id] = {x: nx, y: ny};
  });

  // Draw symbol edges
  DATA.edges.forEach(e => {
    if(nodePositions[e.source] && nodePositions[e.target]) {
      let path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute('d', `M${nodePositions[e.source].x},${nodePositions[e.source].y} L${nodePositions[e.target].x},${nodePositions[e.target].y}`);
      path.setAttribute('class', 'symbol-edge');
      setTimeout(() => path.style.opacity = '1', 800);
      sLayer.appendChild(path);
    }
  });

  symbols.forEach(s => {
    let p = nodePositions[s.id];
    let nEl = document.createElementNS("http://www.w3.org/2000/svg", "g");
    nEl.setAttribute('transform', `translate(${p.x}, ${p.y})`);
    nEl.setAttribute('class', 'symbol-node');
    nEl.onclick = (e) => { e.stopPropagation(); showInspector(s); };

    let sr = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    sr.setAttribute('width', 100);
    sr.setAttribute('height', 30);
    sr.setAttribute('x', -50);
    sr.setAttribute('y', -15);
    sr.setAttribute('class', `symbol-rect role-${s.role}`);
    
    let sl = document.createElementNS("http://www.w3.org/2000/svg", "text");
    sl.setAttribute('y', 4);
    sl.setAttribute('text-anchor', 'middle');
    sl.setAttribute('class', 'symbol-label');
    sl.textContent = s.label.length > 15 ? s.label.substring(0,12)+'..' : s.label;

    nEl.appendChild(sr);
    nEl.appendChild(sl);
    sLayer.appendChild(nEl);
  });

  // Pan to center
  let targetK = 1.2;
  let targetX = W/2 - groupPositions[g.id].x * targetK;
  let targetY = H/2 - groupPositions[g.id].y * targetK;
  animateTransform(targetX, targetY, targetK);
}

function zoomOut() {
  mode = 'overview';
  activeGroup = null;
  document.getElementById('breadcrumb').style.display = 'none';
  inspector.style.display = 'none';
  
  document.querySelectorAll('.group-rect, .group-label').forEach(el => el.style.opacity = '1');
  document.querySelectorAll('.group-edge').forEach(el => el.style.opacity = '1');
  
  let sLayer = document.getElementById('symbol-layer');
  if(sLayer) sLayer.remove();

  drawOverview();
  fitView();
}

function showInspector(s) {
  inspector.style.display = 'block';
  inspector.innerHTML = `
    <h3>${s.label} <span style="font-weight:normal; font-size:12px; color:hsl(var(--muted-foreground))">${s.type}</span></h3>
    <div class="mono">${s.file}:${s.line}</div>
    ${s.http ? `<div class="pill" style="background:hsl(var(--signal)/0.2);color:hsl(var(--signal))">${s.http}</div>` : ''}
    <div class="pill role-${s.role}">${s.role}</div>
    ${s.is_async ? '<div class="pill">async</div>' : ''}
    <div class="mono" style="margin-top:0.5rem">${s.signature}</div>
    <div class="doc" style="color: ${s.doc ? 'inherit' : 'hsl(var(--muted-foreground))'}">${s.doc || 'No docstring'}</div>
    <div style="margin-top:0.5rem">
      ${s.effects.map(e => `<span class="pill fill-core_module">${e}</span>`).join('')}
    </div>
    <div style="margin-top:0.5rem; font-size:12px">Degree: ${s.in_degree} in, ${s.out_degree} out</div>
  `;
}

function toggleConcepts() {
  if (conceptState === 1) {
    conceptState = 2;
    document.getElementById('concept-text').textContent = '✦ Concepts';
    document.getElementById('concept-pulse').style.display = 'none';
    drawConcepts();
  } else if (conceptState === 2) {
    conceptState = 1;
    document.getElementById('concept-text').textContent = '✦ Enrich with AI';
    document.getElementById('concept-pulse').style.display = 'inline-block';
    layerConcepts.innerHTML = '';
  }
}

function drawConcepts() {
  layerConcepts.innerHTML = '';
  DATA.concepts.entities.forEach((c, i) => {
    let pts = [];
    c.files.forEach(f => {
      let p = groupPositions[f];
      if (p) pts.push(p);
    });
    if (pts.length > 0) {
      let cx = pts.reduce((a,b)=>a+b.x,0)/pts.length;
      let cy = pts.reduce((a,b)=>a+b.y,0)/pts.length;
      
      let circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      circle.setAttribute('cx', cx);
      circle.setAttribute('cy', cy);
      circle.setAttribute('r', 150 + pts.length*20);
      circle.setAttribute('class', `concept-zone fill-viz-cat-${(i%8)+1}`);
      circle.setAttribute('stroke', `hsl(var(--viz-cat-${(i%8)+1}))`);
      layerConcepts.appendChild(circle);

      let lbl = document.createElementNS("http://www.w3.org/2000/svg", "text");
      lbl.setAttribute('x', cx);
      lbl.setAttribute('y', cy - 160 - pts.length*20);
      lbl.setAttribute('text-anchor', 'middle');
      lbl.setAttribute('class', 'concept-label');
      lbl.textContent = c.name;
      layerConcepts.appendChild(lbl);
    }
  });
}

function drawMinimap() {
  const content = document.getElementById('minimap-content');
  content.innerHTML = '';
  DATA.groups.forEach(g => {
    let p = groupPositions[g.id];
    let rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    rect.setAttribute('x', p.x);
    rect.setAttribute('y', p.y);
    rect.setAttribute('width', 50);
    rect.setAttribute('height', 50);
    rect.setAttribute('fill', g.drawn ? 'hsl(var(--foreground))' : 'hsl(var(--muted))');
    content.appendChild(rect);
  });
}

function updateMinimapView() {
  const vp = document.getElementById('minimap-viewport');
  vp.setAttribute('x', -transform.x / transform.k);
  vp.setAttribute('y', -transform.y / transform.k);
  vp.setAttribute('width', W / transform.k);
  vp.setAttribute('height', H / transform.k);
}

// Pan & Zoom
function applyTransform() {
  viewport.setAttribute('transform', `translate(${transform.x}, ${transform.y}) scale(${transform.k})`);
  updateMinimapView();
}

function fitView() {
  transform = { x: W/2 - 500, y: H/2 - 500, k: 0.5 };
  applyTransform();
}

function animateTransform(tx, ty, tk) {
  let startX = transform.x, startY = transform.y, startK = transform.k;
  let startTime = performance.now();
  let duration = 800;
  function step(time) {
    let t = Math.min((time - startTime) / duration, 1);
    let ease = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
    transform.x = startX + (tx - startX) * ease;
    transform.y = startY + (ty - startY) * ease;
    transform.k = startK + (tk - startK) * ease;
    applyTransform();
    if (t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

svg.addEventListener('mousedown', e => {
  if (e.target.closest('.symbol-node') || e.target.closest('.group-rect')) return;
  isDragging = true;
  startMouse = { x: e.clientX - transform.x, y: e.clientY - transform.y };
});
window.addEventListener('mousemove', e => {
  if (!isDragging) return;
  transform.x = e.clientX - startMouse.x;
  transform.y = e.clientY - startMouse.y;
  applyTransform();
});
window.addEventListener('mouseup', () => isDragging = false);
svg.addEventListener('wheel', e => {
  e.preventDefault();
  let xs = (e.clientX - transform.x) / transform.k;
  let ys = (e.clientY - transform.y) / transform.k;
  let delta = e.deltaY > 0 ? 0.9 : 1.1;
  transform.k *= delta;
  transform.x = e.clientX - xs * transform.k;
  transform.y = e.clientY - ys * transform.k;
  applyTransform();
});

// Search Palette
window.addEventListener('keydown', e => {
  if (e.key === '/' && !e.ctrlKey && !e.metaKey && e.target.tagName !== 'INPUT') {
    e.preventDefault();
    searchPalette.style.display = 'block';
    searchInput.focus();
    searchInput.value = '';
    renderSearch('');
  }
  if (e.key === 'Escape') {
    searchPalette.style.display = 'none';
    inspector.style.display = 'none';
  }
});
searchInput.addEventListener('input', e => renderSearch(e.target.value));

function renderSearch(q) {
  q = q.toLowerCase();
  let res = DATA.groups.filter(g => g.file.toLowerCase().includes(q)).slice(0, 10);
  searchResults.innerHTML = res.map(g => `
    <div class="search-item" onclick="selectSearch('${g.id}')">
      <span>${g.file}</span>
      <span style="font-size:12px;color:hsl(var(--muted-foreground))">${g.role}</span>
    </div>
  `).join('');
}
window.selectSearch = function(id) {
  let g = DATA.groups.find(x => x.id === id);
  if (g) zoomToGroup(g);
  searchPalette.style.display = 'none';
}

document.body.addEventListener('click', e => {
  if (!e.target.closest('#inspector') && !e.target.closest('.symbol-node') && !e.target.closest('#search-palette')) {
    inspector.style.display = 'none';
  }
});

// Init
init();
</script>
</body>
</html>
