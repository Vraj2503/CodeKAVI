name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Audit dependencies for known vulnerabilities
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt

      - name: Run Ruff Linter
        run: |
          cd backend
          ruff check .

      - name: Run Mypy Type Checker
        run: |
          cd backend
          mypy .

      - name: Run Pytest Test Suite
        run: |
          cd backend
          pytest
          # Guard: fail if the suite ever silently empties again.
          #
          # Reads the "N tests collected" summary rather than counting "::" in
          # a node-id listing. pytest 9 changed `--collect-only -q` to print a
          # `<Function ...>` tree instead of `path::test_name` lines, so the
          # old grep counted 0 and failed a suite where all 71 tests passed.
          # The summary line has been stable across pytest majors.
          COLLECTED="$(pytest --collect-only -q 2>/dev/null \
            | grep -oE '[0-9]+ tests? collected' \
            | grep -oE '^[0-9]+' | tail -1)"
          echo "collected: ${COLLECTED:-0}"
          test "${COLLECTED:-0}" -gt 0

  frontend-lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint Frontend
        run: |
          cd frontend
          npm run lint

      - name: Run Frontend Tests
        run: |
          cd frontend
          npm test

      - name: Build Frontend
        run: |
          cd frontend
          npm run build
